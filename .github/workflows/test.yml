name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r api/requirements.txt
        pip install pytest flake8 black mypy
    
    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check scratch_bot.py database/ api/
      continue-on-error: true
    
    - name: Type check with mypy
      run: |
        mypy scratch_bot.py --ignore-missing-imports
      continue-on-error: true
    
    - name: Test imports
      run: |
        python -c "from database.db_manager import DatabaseManager; print('Database manager import: OK')"
        python -c "import sys; sys.path.insert(0, 'api'); from app import app; print('API import: OK')"
    
    - name: Test database initialization
      run: |
        python -c "from database.db_manager import DatabaseManager; db = DatabaseManager('test.db'); print('Database init: OK')"
    
    - name: Run tests (if they exist)
      run: |
        if (Test-Path tests) { pytest tests/ -v }
      continue-on-error: true
      shell: pwsh
